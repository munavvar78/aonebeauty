name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          AUTH_SECRET: ci-build-secret-not-for-production
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci
        run: npm run build
